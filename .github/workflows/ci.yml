name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linters
        run: pip install flake8 pyflakes
      - name: Syntax check
        run: python -m py_compile main.py
      - name: Lint
        run: flake8 . --max-line-length=120 --exclude=__pycache__ --count --show-source --statistics || true
